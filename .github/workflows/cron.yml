name: Cron jobs

# Vercel Hobby caps crons at once-per-day, so scheduling lives here instead.
# This hits the authed ingest route on the deployed app. Scheduled workflows
# only run from the default branch, and times are UTC. Scoring is no longer a
# cron — it's driven externally over MCP (get_unscored_jobs → set_job_score).
on:
  schedule:
    - cron: "0 6 * * *" # ingest — daily 06:00 UTC
  workflow_dispatch:

env:
  APP_URL: https://rolefetchr.valentinalorcap.com

# Two invocations so each gets its own function time budget: JSearch runs
# several slow queries back to back and used to starve every source after it.
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest (all sources except JSearch)
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$APP_URL/api/cron/ingest?except=JSEARCH"

  ingest-jsearch:
    runs-on: ubuntu-latest
    steps:
      # No retry: every attempt spends the monthly JSearch request quota.
      - name: Trigger ingest (JSearch)
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$APP_URL/api/cron/ingest?only=JSEARCH"
